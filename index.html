<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-SECOURS - Plateforme Mobile d'Urgence</title>
    <meta name="description" content="Plateforme PWA mobile d'assistance, d'orientation et de prise en charge rapide en situation d'urgence au Bénin et en Afrique de l'Ouest." />
    <meta name="theme-color" content="#dc2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="E-SECOURS - Plateforme Mobile d'Urgence" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://esecours.contactesecours.workers.dev" />
    <meta property="og:title" content="E-SECOURS - Plateforme Mobile d'Urgence" />
    <meta property="og:description" content="Une plateforme mobile d'assistance qui vous aide à accéder rapidement" />
    <meta property="og:image" content="./share-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://esecours.contactesecours.workers.dev" />
    <meta property="twitter:title" content="E-SECOURS - Plateforme Mobile d'Urgence" />
    <meta property="twitter:description" content="Une plateforme mobile d'assistance qui vous aide à accéder rapidement" />
    <meta property="twitter:image" content="./share-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('E-Secours PWA ServiceWorker Registered:', reg.scope);
          }).catch((err) => {
            console.log('E-Secours PWA ServiceWorker failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
